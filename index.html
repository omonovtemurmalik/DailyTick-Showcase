.intro{padding-top:18px}.intro p{max-width:58ch}.numbers{gap:12px}.metric,.sales{box-shadow:0 10px 30px #0000000f}.sales{background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 85%, white 15%),var(--panel))}
.phone{position:relative;justify-self:center;width:min(100%,396px);border:8px solid #0b0e10;border-radius:38px;background:var(--phone);box-shadow:0 28px 70px #00000040,0 0 0 1px #ffffff0a inset}
.phone:before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:128px;height:27px;background:#0b0e10;border-radius:0 0 18px 18px;z-index:5}
.phonebar{position:relative;padding:38px 16px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%, black 8%),color-mix(in srgb,var(--phone) 94%, transparent));border-bottom:1px solid var(--line)}
.phonebar:before{content:'9:41';position:absolute;top:10px;left:18px;font-size:12px;font-weight:800;letter-spacing:.3px;color:var(--text);opacity:.92}
.phonebar:after{content:'◔  󰖩  87%';position:absolute;top:10px;right:18px;font-size:12px;font-weight:700;color:var(--text);opacity:.88;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.pill{padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--active) 85%, white 15%);color:var(--ink);font-weight:800;letter-spacing:.6px;box-shadow:0 6px 18px #00000012}
#themeQuick{width:40px;height:40px;padding:0;border-radius:50%;background:color-mix(in srgb,var(--panel) 92%, white 8%);box-shadow:0 6px 18px #00000010;font-size:17px}
.notice{margin:12px 12px 0;border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--active) 82%, transparent),color-mix(in srgb,var(--active) 62%, transparent));backdrop-filter:blur(4px)}
.content{padding:18px 14px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--phone) 96%, white 4%),var(--phone));}
.content::-webkit-scrollbar{width:8px}.content::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.line h2{display:flex;align-items:center;gap:6px;font-size:21px;letter-spacing:-.3px}.line h2 .back{margin-right:2px}
.sub{margin:6px 2px 14px}.section{margin:20px 2px 10px}
.card{border-radius:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 96%, white 4%),color-mix(in srgb,var(--panel) 98%, black 2%));box-shadow:0 8px 22px #00000010}
.cardbutton{padding:16px 16px 15px}.menurow{border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 97%, white 3%),color-mix(in srgb,var(--panel) 98%, black 2%));box-shadow:0 6px 18px #0000000c}
.task{padding:12px 12px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 96%, white 4%),color-mix(in srgb,var(--panel) 98%, black 2%));margin:8px 0;box-shadow:0 6px 18px #0000000c;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:1px solid var(--line)}
.check{border-radius:10px;border-color:color-mix(in srgb,var(--muted) 70%, var(--line) 30%);background:color-mix(in srgb,var(--phone) 80%, transparent)}
.check[aria-pressed=true]{box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 35%, transparent)}
.repeat{border-radius:10px}.repeat.on{background:color-mix(in srgb,var(--active) 80%, transparent)}
.progress{height:9px;border-radius:999px}.progress span{box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 35%, transparent)}
.actions{gap:12px}.actions button{border-radius:15px;min-height:54px;font-weight:750}.primary{box-shadow:0 10px 22px color-mix(in srgb,var(--accent) 35%, transparent)}
.calendar{gap:6px}.calendar span{padding:4px 0;font-weight:650}.calendar button{border-radius:14px;padding:9px 0}.calendar button.selected{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%, transparent)}
.goal button{border-radius:12px}.barplot b{box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 20%, transparent)}
.nav{padding:8px 8px 13px;gap:4px;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 98%, transparent),color-mix(in srgb,var(--panel) 92%, black 8%));box-shadow:0 -8px 20px #00000010 inset}
.nav button{border-radius:14px;font-size:10px;padding:6px 2px}.nav .symbol{width:32px;height:32px;font-size:20px}.nav button[aria-current=page] .symbol{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 18%, transparent)}
.nav button[data-page=today] .symbol{width:44px;height:44px;margin-top:-8px;box-shadow:0 12px 24px color-mix(in srgb,var(--brand) 28%, transparent)}
.locked-block{border-radius:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 95%, white 5%),color-mix(in srgb,var(--panel) 98%, black 2%));box-shadow:0 10px 24px #0000000c}
.locked-card{border-radius:16px;min-height:78px}
.modal{border-radius:24px;box-shadow:0 24px 70px #0007;background:linear-gradient(180deg,color-mix(in srgb,var(--phone) 96%, white 4%),var(--phone))}
@media (max-width:760px){body{background:var(--bg)}.shell{padding-top:8px}.phone{width:100%;border-width:5px;border-radius:28px;box-shadow:0 18px 40px #00000033}.phone:before{width:110px;height:23px}.phonebar{padding-top:34px}.content{padding:16px 12px 12px}.task{margin:7px 0}.card{border-radius:18px}}
</style>
<script id="dt-android-skin-script">
(function(){
 if(window.__dtAndroidSkin) return; window.__dtAndroidSkin=true;
 const originalRender=render;
 render=function(){
   originalRender();
   const pill=document.querySelector('.pill');
   const quick=document.getElementById('themeQuick');
   if(pill){pill.innerHTML='📱 DailyTick Demo'; pill.setAttribute('aria-label','DailyTick demo');}
   if(quick){quick.textContent='⚙'; quick.title='Theme and settings'; quick.setAttribute('aria-label','Theme and settings'); quick.onclick=()=>{page='settings';render();$('content').scrollTop=0;};}
   const h2=document.querySelector('.content h2');
   if(h2 && !document.querySelector('.screen-caption')){
      const cap=document.createElement('div');
      cap.className='screen-caption';
      cap.textContent={en:'Android-style interactive preview',ru:'Интерактивный просмотр в стиле Android',uz:'Android uslubidagi interaktiv namoyish'}[lang]||'Android-style interactive preview';
      cap.style.cssText='margin:-2px 0 10px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.2px';
      h2.parentElement.insertAdjacentElement('afterend',cap);
   }
 };
 render();
})();
</script><style>button[data-action="locked"]{opacity:.62;filter:saturate(.68)}button[data-action="locked"]:hover,button[data-action="locked"]:focus-visible{opacity:.86}</style></body></html>
